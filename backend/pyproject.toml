[project]
name = "brickfinder-backend"
version = "0.1.0"
description = "BrickFinder domain service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "pymupdf>=1.24.0",
  "pillow>=11.0.0",
  "pillow-heif>=0.21.0",
  "numpy>=2.0.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
vision = [
  "transformers>=4.45.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
